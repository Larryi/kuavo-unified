########不需要修改#######
hydra:
    run:
        dir: ./outputs/data_cvt_hydra_save/singlerun/${now:%Y%m%d_%H%M%S}
    sweep:
        dir: ./outputs/data_cvt_hydra_save/multirun/${now:%Y%m%d_%H%M%S}
        subdir: ${hydra:job.override_dirname}

########根据实际目录修改#######
rosbag:
    rosbag_dir: /path/to/your/rosbag
    num_used: null
    lerobot_dir: /path/to/your/lerobot/save/file
    chunk_size: 100

dataset:
    only_arm: true  # 默认true, 是否只使用手臂数据
    eef_type: leju_claw # 真机可选：leju_claw, qiangnao，任务一二是夹爪 leju_claw，任务三是灵巧手 qiangnao
    which_arm: right  # 需要哪一只手臂的数据，可选: left, right, both，注意这会同时选择对应手臂的相机，已默认包含头部相机，任务一和三是单手操作，可以选right（但不是一定选），任务二必须选both
    use_depth: false  # 是否需要深度图像数据，与上面手臂保持一致的深度数据，目前本分支只有diffusion policy支持了深度，ACT policy暂不支持深度图像，但在dev分支中已经支持
    depth_range: [0, 1500]  # 深度图的裁剪范围，单位：毫米

    task_description: "Pick and Place the safety belt, cable and pin connector"

    train_hz: 10
    main_timeline: head_cam_h
    main_timeline_fps: 30
    sample_drop: 10


    dex_dof_needed: 1

    is_binary: false
    delta_action: false
    relative_start: false

    resize:
        width: 848
        height: 480
