model:
  model_path: /workspace/models/LingBotVLA
  tokenizer_path: /workspace/models/Qwen2.5_VL
  post_training: true
  adanorm_time: true

data:
  datasets_type: vla
  data_name: kuavo_v1_bimanual
  train_path: /workspace/datasets/lerobot_task2_264
  robot_config_root: configs/robot_configs
  joints:
    - arm.position: 14
    - effector.position: 2
  cameras:
    - camera_top
    - camera_wrist_left
    - camera_wrist_right
  num_workers: 8
  prefetch_factor: 4
  pin_memory: true
  norm_type: bounds_99
  norm_stats_file: /workspace/runs/task2_264_full/norm_stats/task2_264.json

train:
  output_dir: /workspace/runs/task2_264_full
  loss_type: fm
  data_parallel_mode: fsdp2
  enable_full_shard: true
  module_fsdp_enable: true
  enable_mixed_precision: true
  enable_fp32: false
  enable_gradient_checkpointing: true
  enable_activation_offload: false
  use_compile: true
  use_ema: false
  rmpad: false
  rmpad_with_pos_ids: false
  ulysses_parallel_size: 1
  freeze_vision_encoder: false
  freeze_vit: false
  tokenizer_max_length: 24
  action_dim: 16
  max_action_dim: 75
  max_state_dim: 75
  chunk_size: 50
  ignore_depth: true
  lr: 2.0e-5
  lr_min: 1.0e-6
  lr_start: 0.0
  lr_decay_style: cosine
  lr_warmup_ratio: 0.03
  lr_decay_ratio: 1.0
  num_train_epochs: 10
  micro_batch_size: 4
  global_batch_size: 32
  gradient_accumulation_steps: 2
  ckpt_manager: dcp
  save_steps: 500
  save_epochs: 10000
  save_hf_weights: false
  keep_last_checkpoints: 1
  enable_resume: true
  resume_dataloader_state: true
  use_wandb: true
  wandb_project: LingBotVLA-Kuavo
  wandb_name: task2_264_full
