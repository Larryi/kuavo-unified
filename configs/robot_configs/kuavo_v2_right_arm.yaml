states:
  - observation.state.arm.position:
      origin_keys:
        - observation.state: {start: 0, end: 7, target_start: 7}
  - observation.state.effector.position:
      origin_keys:
        - observation.state: {start: 7, end: 8, target_start: 1}

actions:
  - action.arm.position:
      origin_keys:
        - action: {start: 0, end: 7, target_start: 7}
      subtract_state: true
      relative_type: joint
  - action.effector.position:
      origin_keys:
        - action: {start: 7, end: 8, target_start: 1}
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.head_cam_h
  - observation.images.camera_wrist_right:
      origin_keys: observation.images.wrist_cam_r

norm_stats: assets/norm_stats/kuavo_v2_right_arm_meanstd.json
