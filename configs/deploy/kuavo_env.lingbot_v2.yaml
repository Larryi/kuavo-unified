env:
  env_name: Kuavo-Real
  control_mode: joint
  eef_type: leju_claw
  which_arm: right
  head_init: null
  ros_rate: 10
  only_arm: true
  image_size: &image_size [848, 480]
  depth_range: [0, 1500]
  obs_key_map:
    head_cam_h: ["/cam_h/color/image_raw/compressed", "CompressedImage", 30, *image_size]
    wrist_cam_r: ["/cam_r/color/image_raw/compressed", "CompressedImage", 30, *image_size]
    joint_q: ["/sensors_data_raw", "sensorsData", 500]
    leju_claw: ["/leju_claw_state", "lejuClawState", 500]
  arm_state_keys: [joint_q, gripper]
  frame_alignment: false
  ratio: 1.0
  is_binary: false

inference:
  policy_type: lingbot_v2
  pretrained_path: "__PRETRAINED_PATH__"
  eval_episodes: 1
  max_episode_steps: 2000
  seed: 42
  start_seed: 42
  device: cuda
  task: r1
  method: lingbot_v2_lora
  timestamp: run_x
  epoch: latest
  task_prompt: Pick and place the target object
  lingbot_v2_root: /opt/kuavo/third_party/lingbot-vla-v2
  qwen3vl_path: /assets/qwen
  lingbot_v2_robot_name: kuavo_v2_right_arm
  lingbot_v2_use_compile: false
  lingbot_use_length: 5
  lingbot_chunk_ret: false
  lingbot_norm_stats_file: /assets/norm_stats/norm_stats.json
