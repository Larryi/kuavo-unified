env:
  real: true
  env_name: Kuavo-Real
  control_mode: joint
  eef_type: leju_claw
  which_arm: right
  only_arm: true
  ros_rate: 10
  image_size: [848, 480]
  obs_key_map:
    head_cam_h: ["/cam_h/color/image_raw/compressed", "CompressedImage", 30, [848, 480]]
    wrist_cam_r: ["/cam_r/color/image_raw/compressed", "CompressedImage", 30, [848, 480]]
    joint_q: ["/sensors_data_raw", "sensorsData", 500]
    leju_claw: ["/leju_claw_state", "lejuClawState", 500]
  arm_state_keys: [joint_q, gripper]
  frame_alignment: false
  ratio: 1.0

inference:
  policy_type: diffusion
  pretrained_path: "__PRETRAINED_PATH__"
  eval_episodes: 1
  max_episode_steps: 1000
  seed: 42
  start_seed: 42
  device: cuda
  task: task1
  method: diffusion
  timestamp: container
  epoch: latest
