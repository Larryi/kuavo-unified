env:
  real: true
  env_name: Kuavo-Real
  control_mode: joint
  eef_type: leju_claw
  which_arm: right
  only_arm: true
  ros_rate: 10
  image_size: [848, 480]
  obs_key_map:
    head_cam_h: ["/cam_h/color/image_raw/compressed", "CompressedImage", 30, [848, 480]]
    wrist_cam_r: ["/cam_r/color/image_raw/compressed", "CompressedImage", 30, [848, 480]]
    joint_q: ["/sensors_data_raw", "sensorsData", 500]
    leju_claw: ["/leju_claw_state", "lejuClawState", 500]
  arm_state_keys: [joint_q, gripper]
  frame_alignment: false
  ratio: 1.0

inference:
  policy_type: lingbot
  pretrained_path: "__PRETRAINED_PATH__"
  eval_episodes: 1
  max_episode_steps: 1000
  seed: 42
  start_seed: 42
  device: cuda
  task: task1
  method: lingbot_v1
  timestamp: container
  epoch: latest
  task_prompt: "Pick and Place the safety belt, cable and pin connector"
  lingbot_root: /root/kuavo_data_challenge/third_party/lingbot-vla
  qwen25_path: /assets/qwen
  lingbot_norm_stats_file: /assets/norm_stats/norm_stats.json
  # This shipped checkpoint was trained by the legacy custom Task1 loader with
  # absolute arm actions. Do not use the newer relative-action profile here.
  lingbot_robot_name: kuavo_v1_right_arm
  lingbot_use_length: 5
  lingbot_chunk_ret: false
  lingbot_use_compile: false
