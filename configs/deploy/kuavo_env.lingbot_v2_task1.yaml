env:
  real: true
  env_name: Kuavo-Real
  control_mode: joint
  eef_type: leju_claw
  which_arm: right
  only_arm: true
  ros_rate: 10
  image_size: &image_size [848, 480]
  obs_key_map:
    head_cam_h: ["/cam_h/color/image_raw/compressed", "CompressedImage", 30, *image_size]
    wrist_cam_r: ["/cam_r/color/image_raw/compressed", "CompressedImage", 30, *image_size]
    joint_q: ["/sensors_data_raw", "sensorsData", 500]
    leju_claw: ["/leju_claw_state", "lejuClawState", 500]
  arm_state_keys: [joint_q, gripper]
  frame_alignment: false
  ratio: 1.0
  is_binary: false

inference:
  policy_type: client
  client_protocol: msgpack_websocket
  client_host: 127.0.0.1
  client_port: 8000
  client_connect_timeout_s: 300
  client_request_timeout_s: 120
  client_api_key_env: KUAVO_POLICY_API_KEY
  client_action_dim: 8
  client_state_dim: 8
  client_execute_steps: 1
  client_validate_schema: true
  client_autostart: true
  client_autostart_backend: lingbot_v2
  client_server_startup_timeout_s: 300
  client_server_log: /tmp/lingbot-v2-policy-server.log
  pretrained_path: "__PRETRAINED_PATH__"
  eval_episodes: 1
  max_episode_steps: 1000
  seed: 42
  start_seed: 42
  device: cuda
  task: task1
  method: lingbot_v2_lora
  timestamp: run_x
  epoch: latest
  task_prompt: "Pick and Place the safety belt, cable and pin connector"
  lingbot_v2_root: /root/kuavo_data_challenge/third_party/lingbot-vla-v2
  qwen3vl_path: /assets/qwen
  lingbot_v2_robot_name: kuavo_v2_right_arm
  lingbot_v2_use_compile: false
  lingbot_use_length: 5
  lingbot_chunk_ret: false
  lingbot_norm_stats_file: /assets/norm_stats/norm_stats.json
